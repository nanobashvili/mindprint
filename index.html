<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mindprint</title>
<meta name="description" content="3 minutes. Find out who you are and beat your friends.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mindprint">
<meta property="og:url" content="https://nanobashvili.github.io/mindprint/">
<meta property="og:title" content="Who are you? A friend challenged you">
<meta property="og:description" content="Speed, logic, accuracy, intuition. 3 minutes to find out who wins.">
<meta property="og:image" content="https://nanobashvili.github.io/mindprint/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Mindprint: Who are you? A friend challenged you.">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --bg:#141413;--panel:#1f1f1d;--line:#34342f;--text:#f1efe8;--muted:#a3a19a;
  --speed:#f0997b;--logic:#afa9ec;--acc:#5dcaa5;--intu:#ed93b1;--accent:#f1efe8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;justify-content:center;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{width:100%;max-width:420px;min-height:100%;padding:24px 20px 32px;display:flex;flex-direction:column}
h1{font-size:28px;font-weight:600;margin:0 0 8px;letter-spacing:-.02em}
h2{font-size:22px;font-weight:600;margin:0 0 6px}
p{margin:0 0 12px;line-height:1.5;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;background:var(--accent);color:#141413;font-size:17px;font-weight:600;cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
input.name{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:17px;outline:none}
.grow{flex:1}
.center{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.ghostline{font-size:13px;color:var(--muted);margin-bottom:12px;min-height:18px}
.pad{flex:1;border-radius:20px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;text-align:center;padding:20px;cursor:pointer;min-height:340px;transition:background .08s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{padding:22px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:22px;font-weight:600;color:var(--text);cursor:pointer}
.opt:active{transform:scale(.97)}
.seq{font-size:30px;font-weight:600;letter-spacing:.02em;margin:30px 0 10px;text-align:center}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--text)}
canvas.draw{width:100%;aspect-ratio:1;border-radius:20px;background:var(--panel);touch-action:none}
.dots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.dots canvas{width:100%;aspect-ratio:1;border-radius:16px;background:var(--panel)}
.card{background:#1f1f1d;border:1px solid var(--line);border-radius:22px;padding:22px}
.card .no{font-size:11px;color:var(--muted);letter-spacing:.12em}
.card .st{font-size:34px;font-weight:600;margin:6px 0 2px;letter-spacing:-.02em}
.card .tags{font-size:15px;color:var(--muted);margin-bottom:18px}
.row{display:flex;align-items:center;gap:10px;font-size:13px;color:#d3d1c7;margin-top:9px}
.row span:first-child{width:70px}
.row .bar{flex:1;height:8px;border-radius:4px;margin:0;background:#34342f}
.row .bar>i{border-radius:4px}
.row b{width:28px;text-align:right;font-weight:600}
.lock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.lock div{border:1px dashed var(--line);border-radius:12px;padding:12px 6px;text-align:center;font-size:12px;color:var(--muted)}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#141413;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------- utils ----------
const $ = s => document.querySelector(s);
const app = $('#app');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
function cdf(z){const t=1/(1+.2316419*Math.abs(z));const d=.3989423*Math.exp(-z*z/2);let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
// Prototype norms: guesses until real players give us real distributions.
const pct = (v,mean,sd,lowerBetter) => clamp(Math.round(100*cdf(lowerBetter?(mean-v)/sd:(v-mean)/sd)),1,99);
const b64e = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
let actx;
function beep(f=660,d=.06,type='sine',vol=.08){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
const buzz = ms => {try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const good = () => {beep(880,.08);buzz(15)};
const bad = () => {beep(180,.12,'square',.05);buzz([30,40,30])};
function toast(t){const d=document.createElement('div');d.className='toast fade';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SK = [
  {k:'S',name:'Speed',c:'var(--speed)',hex:'#f0997b'},
  {k:'L',name:'Logic',c:'var(--logic)',hex:'#afa9ec'},
  {k:'P',name:'Accuracy',c:'var(--acc)',hex:'#5dcaa5'},
  {k:'N',name:'Intuition',c:'var(--intu)',hex:'#ed93b1'},
];

const PICKS = [
  ['Mountains','Sea'],['Night','Morning'],['Plan','Improvise'],['Lead','Support'],
  ['Fast','Perfect'],['Big group','Few close friends'],['Risk','Safe'],['City','Nature'],
  ['Talk','Text'],['Win','Have fun'],
];

// ---------- state ----------
let challenger = null;
try{const m=location.hash.match(/c=([^&]+)/);if(m)challenger=b64d(m[1])}catch(e){challenger=null}
const st = {
  name: (store.get('mp_name') && !(challenger && challenger.n === store.get('mp_name'))) ? store.get('mp_name') : '',
  seed: challenger ? challenger.seed : (Math.random()*1e9)|0,
  raw: {}, picks: [], early: 0, friendHits: 0,
};
let rng = mulberry32(st.seed);

// ---------- screens ----------
function landing(){
  const c = challenger;
  const left = c ? Math.max(0, 24 - Math.floor((Date.now()-c.t)/3.6e6)) : 0;
  app.innerHTML = `
    <div class="grow center fade">
      <div class="small" style="letter-spacing:.14em;margin-bottom:18px">MINDPRINT</div>
      ${c ? `<h1>${esc(c.n)} challenged you</h1>
             <p>${esc(c.n)} is <b style="color:var(--text)">${esc(c.st)}</b> · ${c.total} points<br>${left}h left to answer</p>`
          : `<h1>Who are you?</h1><p>3 minutes. Speed, logic, accuracy, intuition.<br>Get your status. Beat your friends.</p>`}
      <div style="width:100%;margin-top:22px">
        <input class="name" id="nm" maxlength="16" placeholder="Your first name" value="${esc(st.name)}" autocomplete="given-name">
        <button class="btn" id="go">${c ? 'Accept challenge' : 'Play'}</button>
      </div>
      <p class="small" style="margin-top:14px">No sign-up. Sound on is better.</p>
    </div>`;
  $('#go').onclick = () => {
    const n = $('#nm').value.trim();
    if(!n){ $('#nm').focus(); $('#nm').style.borderColor='var(--speed)'; return; }
    st.name = n; store.set('mp_name', n); beep(520,.05);
    run();
  };
}

function header(i, title, ghost){
  const s = SK[i];
  return `<div class="top"><span><span class="dot" style="background:${s.c}"></span>${s.name} · ${i+1}/4</span><span>${esc(st.name)}</span></div>
          <h2>${title}</h2>
          <div class="ghostline">${challenger && ghost ? ghost : ''}</div>`;
}

async function intro(i, text){
  const s = SK[i];
  app.innerHTML = `<div class="grow center fade">
    <div style="width:64px;height:64px;border-radius:50%;background:${s.c};margin-bottom:18px" class="pop"></div>
    <h1>${s.name}</h1><p>${text}</p></div>`;
  beep(440+i*110,.1);
  await sleep(1700);
}

// 1. Speed: reaction time, 5 taps
async function roundSpeed(){
  await intro(0,'Tap the moment the pad turns coral.');
  const times = [];
  const ghost = challenger ? `${esc(challenger.n)}'s average: ${challenger.raw.speed} ms` : '';
  for(let t=0;t<5;t++){
    app.innerHTML = header(0,`Tap ${t+1} of 5`,ghost) + `<div class="pad" id="pad">Wait…</div><p class="small" style="margin-top:12px">${times.map(x=>x+' ms').join(' · ')}</p>`;
    const pad = $('#pad');
    const ms = await new Promise(res => {
      let ready = false, start = 0;
      const delay = 900 + rng()*2200;
      const to = setTimeout(()=>{ ready=true; start=performance.now(); pad.style.background='var(--speed)'; pad.style.color='#141413'; pad.textContent='Tap!'; }, delay);
      pad.onpointerdown = () => {
        if(!ready){ clearTimeout(to); st.early++; bad(); pad.textContent='Too early'; pad.onpointerdown=null; setTimeout(()=>res(650),700); return; }
        const v = Math.round(performance.now()-start); good(); pad.onpointerdown=null; res(v);
      };
    });
    times.push(ms);
    await sleep(350);
  }
  st.raw.speed = Math.round(times.reduce((a,b)=>a+b,0)/times.length);
}

// 2. Logic: 5 sequences, 8 s each
function makeSeq(){
  const type = Math.floor(rng()*5);
  let a = 1+Math.floor(rng()*9), d = 2+Math.floor(rng()*7), s = [];
  if(type===0){ for(let i=0;i<5;i++) s.push(a+i*d); }
  else if(type===1){ const r=2+Math.floor(rng()*2); for(let i=0;i<5;i++) s.push(a*Math.pow(r,i)); }
  else if(type===2){ const e=1+Math.floor(rng()*4); let v=a+10; for(let i=0;i<5;i++){ s.push(v); v += i%2===0 ? d : -e; } }
  else if(type===3){ const o=Math.floor(rng()*4); for(let i=0;i<5;i++) s.push((i+1+o)*(i+1+o)); }
  else { let x=a, y=a+Math.floor(rng()*4)+1; s=[x,y]; for(let i=2;i<5;i++) s.push(s[i-1]+s[i-2]); }
  const ans = s[4];
  const set = new Set([ans]);
  const cands = [ans+1, ans-1, ans+d, ans-d, ans+2, s[3]+(s[3]-s[2]), ans*2-s[3]];
  for(const c of cands){ if(set.size>=4) break; if(c>0 && !set.has(c)) set.add(c); }
  let k=3; while(set.size<4) set.add(ans+(k++));
  const opts = shuffle([...set]);
  return {shown:s.slice(0,4), ans, opts};
}
async function roundLogic(){
  await intro(1,'What comes next? 8 seconds each.');
  let pts = 0, correct = 0;
  const ghost = challenger ? `${esc(challenger.n)} solved ${challenger.raw.logic} of 5` : '';
  for(let q=0;q<5;q++){
    const P = makeSeq();
    app.innerHTML = header(1,`Puzzle ${q+1} of 5`,ghost) + `
      <div class="bar"><i id="tb" style="width:100%"></i></div>
      <div class="seq">${P.shown.join('  ')}  ?</div>
      <div class="opts">${P.opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`;
    const t0 = performance.now();
    const res = await new Promise(r => {
      const iv = setInterval(()=>{ const e=(performance.now()-t0)/8000; $('#tb').style.width=Math.max(0,100-e*100)+'%'; if(e>=1){clearInterval(iv); r(null);} }, 50);
      app.querySelectorAll('.opt').forEach(b => b.onclick = () => { clearInterval(iv); r({v:+b.dataset.v, t:(performance.now()-t0)/1000, el:b}); });
    });
    if(res && res.v===P.ans){ correct++; pts += 1 + Math.max(0,(8-res.t)/8)*.5; good(); res.el.style.background='var(--logic)'; res.el.style.color='#141413'; }
    else { bad(); if(res) res.el.style.opacity=.35; app.querySelectorAll('.opt').forEach(b=>{ if(+b.dataset.v===P.ans){ b.style.borderColor='var(--logic)'; } }); }
    await sleep(600);
  }
  st.raw.logic = correct; st.raw.logicPts = Math.round(pts*100)/100;
}

// 3. Accuracy: stop at 3.00 s twice, then draw a circle
async function roundAccuracy(){
  await intro(2,'Stop the timer at exactly 3.00 s. Then draw a perfect circle.');
  const errs = [];
  const ghost = challenger ? `${esc(challenger.n)}: ${challenger.raw.acc} ms off · circle ${challenger.raw.circle}%` : '';
  for(let t=0;t<2;t++){
    app.innerHTML = header(2,`Stop at 3.00 s · try ${t+1} of 2`,ghost) + `<div class="pad" id="pad" style="font-size:48px">0.00</div><p class="small" style="margin-top:12px">Tap to start, tap again to stop. The clock hides after 1 second.</p>`;
    const pad = $('#pad');
    const err = await new Promise(r => {
      let t0 = 0, raf = 0;
      pad.onpointerdown = () => {
        if(!t0){ t0=performance.now(); beep(600,.05); const tick=()=>{ const e=(performance.now()-t0)/1000; pad.textContent = e<1 ? e.toFixed(2) : '?.??'; raf=requestAnimationFrame(tick); }; tick(); return; }
        cancelAnimationFrame(raf); const e=performance.now()-t0; pad.onpointerdown=null;
        const off = Math.round(Math.abs(e-3000)); pad.textContent=(e/1000).toFixed(2); pad.style.color = off<100 ? 'var(--acc)' : 'var(--text)';
        off<100 ? good() : bad(); r(off);
      };
    });
    errs.push(err);
    await sleep(900);
  }
  st.raw.acc = Math.round((errs[0]+errs[1])/2);
  // circle
  app.innerHTML = header(2,'Draw a perfect circle around the dot',ghost) + `<canvas class="draw" id="cv"></canvas><p class="small" id="cr" style="margin-top:12px;text-align:center">One stroke. Lift your finger to finish.</p>`;
  st.raw.circle = await drawCircle($('#cv'));
  await sleep(1300);
}
function drawCircle(cv){
  return new Promise(r => {
    const dpr = window.devicePixelRatio||1, w = cv.clientWidth;
    cv.width = w*dpr; cv.height = w*dpr;
    const g = cv.getContext('2d'); g.scale(dpr,dpr);
    const C = w/2;
    const dot = () => { g.fillStyle='#a3a19a'; g.beginPath(); g.arc(C,C,4,0,7); g.fill(); };
    dot();
    let pts = [], down = false;
    const pos = e => { const b=cv.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
    cv.onpointerdown = e => { down=true; pts=[pos(e)]; g.clearRect(0,0,w,w); dot(); try{ cv.setPointerCapture(e.pointerId); }catch(err){} };
    cv.onpointermove = e => { if(!down) return; const p=pos(e), q=pts[pts.length-1]; pts.push(p);
      g.strokeStyle='#5dcaa5'; g.lineWidth=4; g.lineCap='round'; g.beginPath(); g.moveTo(q[0],q[1]); g.lineTo(p[0],p[1]); g.stroke(); };
    cv.onpointerup = () => {
      if(!down) return; down=false;
      const ds = pts.map(p=>Math.hypot(p[0]-C,p[1]-C));
      const mean = ds.reduce((a,b)=>a+b,0)/ds.length;
      let sweep = 0;
      for(let i=1;i<pts.length;i++){ let a1=Math.atan2(pts[i-1][1]-C,pts[i-1][0]-C), a2=Math.atan2(pts[i][1]-C,pts[i][0]-C); let d=a2-a1; if(d>Math.PI)d-=2*Math.PI; if(d<-Math.PI)d+=2*Math.PI; sweep+=d; }
      if(pts.length<20 || mean<w*.12 || Math.abs(sweep)<Math.PI*1.6){ bad(); $('#cr').textContent='Too small or not closed. Try again.'; g.clearRect(0,0,w,w); dot(); return; }
      const sd = Math.sqrt(ds.reduce((a,b)=>a+(b-mean)*(b-mean),0)/ds.length);
      const closure = Math.min(1, Math.abs(sweep)/(2*Math.PI));
      const score = clamp(Math.round((100 - (sd/mean)*350) * (0.6+0.4*closure)), 0, 99);
      score>=80 ? good() : beep(500,.08);
      $('#cr').innerHTML = `<b style="color:var(--acc);font-size:22px">${score}%</b> round`;
      cv.onpointerdown = cv.onpointermove = cv.onpointerup = null;
      r(score);
    };
  });
}

// 4. Intuition: 5 gut flashes, your picks, then guess the challenger's picks
function dotsCanvas(cv, n){
  const dpr = window.devicePixelRatio||1, w = cv.clientWidth;
  cv.width=w*dpr; cv.height=w*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr);
  g.fillStyle='#ed93b1';
  for(let i=0;i<n;i++){ const x=12+rng()*(w-24), y=12+rng()*(w-24); g.beginPath(); g.arc(x,y,4.5,0,7); g.fill(); }
}
async function roundIntuition(){
  await intro(3,'Trust your gut. Which side has more? You get half a second.');
  let hits = 0;
  const ghost = challenger ? `${esc(challenger.n)} felt ${challenger.raw.intu} of 5 right` : '';
  for(let q=0;q<5;q++){
    const base = 18+Math.floor(rng()*14), diff = 2+Math.floor(rng()*4);
    const leftMore = rng()<.5, L = leftMore?base+diff:base, R = leftMore?base:base+diff;
    app.innerHTML = header(3,`Flash ${q+1} of 5`,ghost) + `<div class="dots"><canvas id="a"></canvas><canvas id="b"></canvas></div>
      <div class="opts"><button class="opt" id="l" style="visibility:hidden">Left</button><button class="opt" id="r" style="visibility:hidden">Right</button></div>`;
    dotsCanvas($('#a'),L); dotsCanvas($('#b'),R);
    await sleep(550);
    ['#a','#b'].forEach(s=>{ const c=$(s); c.getContext('2d').clearRect(0,0,c.width,c.height); });
    $('#l').style.visibility = $('#r').style.visibility = 'visible';
    const pickLeft = await new Promise(r => { $('#l').onclick=()=>r(true); $('#r').onclick=()=>r(false); });
    if(pickLeft===leftMore){ hits++; good(); } else bad();
    await sleep(300);
  }
  st.raw.intu = hits;
  // this-or-that: same 3 questions for both players (seeded)
  const pool = shuffle([...PICKS.keys()]).slice(0,3);
  for(let i=0;i<3;i++){
    const [a,b] = PICKS[pool[i]];
    app.innerHTML = header(3,'Your pick','') + `<p>No right answer. This shapes your status.</p>
      <div class="opts" style="grid-template-columns:1fr"><button class="opt" id="x">${a}</button><button class="opt" id="y">${b}</button></div>`;
    const v = await new Promise(r=>{ $('#x').onclick=()=>r(0); $('#y').onclick=()=>r(1); });
    beep(560,.05);
    st.picks.push([pool[i], v]);
    if(challenger && challenger.p && challenger.p[i]){
      app.innerHTML = header(3,`What did ${esc(challenger.n)} pick?`,'') + `<p>Read your friend.</p>
        <div class="opts" style="grid-template-columns:1fr"><button class="opt" id="x">${a}</button><button class="opt" id="y">${b}</button></div>`;
      const g = await new Promise(r=>{ $('#x').onclick=()=>r(0); $('#y').onclick=()=>r(1); });
      const real = challenger.p[i][1];
      if(g===real){ st.friendHits++; good(); toast(`Right. ${challenger.n} picked ${real?b:a}`); } else { bad(); toast(`No. ${challenger.n} picked ${real?b:a}`); }
      await sleep(900);
    }
  }
}

// ---------- scoring and status ----------
function scores(){
  const S = pct(st.raw.speed, 300, 60, true);
  const L = pct(st.raw.logicPts, 3.6, 1.6, false);
  const P = Math.round((pct(st.raw.acc, 140, 90, true) + pct(st.raw.circle, 72, 13, false))/2);
  const nGut = st.raw.intu + (challenger ? st.friendHits*0.7 : 0);
  const N = pct(nGut, challenger ? 4.6 : 3.4, challenger ? 1.2 : 1, false);
  return {S, L, P, N};
}
function picked(name){ for(const [i,v] of st.picks){ if(PICKS[i][v]===name) return 1; } return 0; }
function status(sc){
  const {S,L,P,N} = sc, avg = (S+L+P+N)/4, spread = Math.max(S,L,P,N)-Math.min(S,L,P,N);
  const c = {
    Leader:      picked('Lead')*40 + picked('Big group')*25 + picked('Talk')*10 + avg*.3,
    Connector:   picked('Big group')*30 + picked('Talk')*25 + picked('Have fun')*15 + N*.2,
    Solo:        picked('Few close friends')*35 + picked('Text')*15 + picked('Plan')*10 + (L+P)*.15,
    Competitor:  picked('Win')*35 + picked('Risk')*10 + S*.35,
    Observer:    (st.early===0?15:0) + picked('Safe')*15 + P*.35 - S*.1,
    Thinker:     L*.7 - S*.1 + picked('Plan')*10,
    Strategist:  (L+N)*.4 + picked('Plan')*15,
    Analyst:     (spread<20 ? 30 : 0) + avg*.4,
    Tech:        (S+P)*.4 + picked('Fast')*10,
    Geek:        (L+P)*.35 + picked('Text')*10 + picked('Night')*5,
    Visionary:   N*.6 + picked('Improvise')*10,
    Dreamer:     picked('Risk')*25 + picked('Improvise')*25 + N*.2,
    'Dark horse':(Math.max(S,L,P,N)>80 && avg<55 ? 55 : 0) + Math.max(S,L,P,N)*.1,
    Perfectionist: P*.55 + picked('Perfect')*25,
    Natural:     N*.5 + S*.2 + picked('Have fun')*10,
    Enthusiast:  25 + picked('Have fun')*15 + picked('Sea')*5,
    Explorer:    picked('Nature')*20 + picked('Mountains')*15 + picked('Improvise')*15 + avg*.2,
    Founder:     (challenger ? 0 : 20) + picked('Lead')*15 + picked('Risk')*10 + avg*.2,
  };
  const ranked = Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const h = new Date().getHours();
  const time = (h>=22||h<5) ? 'Night owl' : (h>=5&&h<9) ? 'Early bird' : null;
  const tags = time ? [time, ranked[1]] : [ranked[1], ranked[2]];
  return {main: ranked[0], tags};
}

// ---------- results ----------
async function results(){

  const no = String(1 + (st.seed % 9999)).padStart(4,'0');
  const me = {n:st.name, seed:st.seed, t:Date.now(), st:stt.main, total, sc,
    raw:{speed:st.raw.speed, logic:st.raw.logic, acc:st.raw.acc, circle:st.raw.circle, intu:st.raw.intu}, p:st.picks};
  // step 1: who won
  if(challenger){
    const win = total >= challenger.total;
    app.innerHTML = `<div class="grow center fade"><div class="small" style="letter-spacing:.14em">RESULT</div>
      <h1 class="pop" style="font-size:40px;margin-top:14px">${win?'You won':esc(challenger.n)+' won'}</h1>
      <p style="font-size:18px">${esc(st.name)} ${total} · ${esc(challenger.n)} ${challenger.total}</p></div>`;
    win ? (beep(660,.1),setTimeout(()=>beep(990,.15),120)) : beep(220,.2);
    await sleep(2300);
  }
  // step 2: status reveal with a pause
  app.innerHTML = `<div class="grow center fade"><div class="small" style="letter-spacing:.14em">YOU ARE</div><h1 id="rv" style="font-size:44px;margin-top:16px;opacity:.25">· · ·</h1></div>`;
  for(let i=0;i<6;i++){ beep(300+i*60,.04); await sleep(260); }
  $('#rv').textContent = stt.main; $('#rv').style.opacity = 1; $('#rv').className='pop';
  beep(990,.25,'triangle',.1); buzz(40);
  await sleep(1600);
  // step 3: card
  const strong = SK.slice().sort((a,b)=>sc[b.k]-sc[a.k])[0];
  const sim = challenger ? similarity(sc, challenger.sc, st.picks, challenger.p) : null;
  app.innerHTML = `<div class="fade">
    <div class="card" id="card">
      <div class="no">MINDPRINT · No. ${no}</div>
      <div class="st">${esc(stt.main)}</div>
      <div class="tags">${esc(st.name)} · ${stt.tags.map(esc).join(' · ')}</div>
      ${SK.map(s=>`<div class="row"><span>${s.name}</span><div class="bar"><i style="width:${sc[s.k]}%;background:${s.c}"></i></div><b>${sc[s.k]}</b></div>`).join('')}
      <p style="color:#d3d1c7;margin:16px 0 0;font-size:14px">${LINES[stt.main]} Strongest: ${strong.name.toLowerCase()}, better than ${sc[strong.k]}% of players.</p>
    </div>
    ${sim!==null ? `<p style="text-align:center;margin-top:14px;color:var(--text)">You and ${esc(challenger.n)} are <b>${sim}%</b> alike</p>` : ''}
    <button class="btn" id="ch">Challenge a friend</button>
    <button class="btn ghost" id="sv">Save card for story</button>
    <button class="btn ghost" id="bio">Copy to my bio</button>
    <p class="small" style="margin-top:22px;color:var(--text)">${opposite(stt.main)}</p>
    <div class="lock"><div>?<br>91% like you</div><div>?<br>87% like you</div><div>?<br>84% like you</div></div>
    <p class="small" style="margin-top:8px">Friends of your friends who play like you. They unlock as your friends play.</p>
    <button class="btn ghost" id="again" style="margin-top:18px">Play again</button>
  </div>`;
  const link = location.origin + location.pathname + '#c=' + b64e(me);
  $('#ch').onclick = async () => {
    const text = `I'm ${stt.main} on Mindprint. ${total} points. Beat me in 24h:`;
    if(navigator.share){ try{ await navigator.share({title:'Mindprint', text, url:link}); return; }catch(e){ if(e.name==='AbortError') return; } }
    try{ await navigator.clipboard.writeText(text+' '+link); toast('Challenge link copied'); }catch(e){ prompt('Copy this link', link); }
  };
  $('#bio').onclick = async () => {
    const bio = `${stt.main} · ${stt.tags.join(' · ')} | Mindprint`;
    try{ await navigator.clipboard.writeText(bio); toast('Copied: '+bio); }catch(e){ prompt('Copy', bio); }
  };
  $('#sv').onclick = () => saveCard(stt, sc, no);
  $('#again').onclick = () => { location.hash=''; location.reload(); };
}
function similarity(a, b, pa, pb){
  const d = SK.reduce((s,k)=>s+Math.abs(a[k.k]-b[k.k]),0)/4;
  let same = 0; if(pb) pa.forEach((p,i)=>{ if(pb[i] && pb[i][1]===p[1]) same++; });
  return clamp(Math.round(100 - d*.9 - (3-same)*6), 35, 98);
}
function opposite(m){
  const o = {Leader:'Solo',Solo:'Leader',Connector:'Observer',Observer:'Connector',Competitor:'Natural',Natural:'Competitor',
    Thinker:'Natural',Strategist:'Dreamer',Dreamer:'Strategist',Analyst:'Dark horse','Dark horse':'Analyst',Tech:'Thinker',
    Geek:'Enthusiast',Enthusiast:'Geek',Visionary:'Perfectionist',Perfectionist:'Visionary',Explorer:'Founder',Founder:'Explorer'}[m] || 'Solo';
  return `Your opposite is a <b>${o}</b>. Who in your contacts is one? Challenge them.`;
}
function saveCard(stt, sc, no){
  const W=1080,H=1920,c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  g.fillStyle='#141413'; g.fillRect(0,0,W,H);
  g.fillStyle='#1f1f1d'; g.beginPath(); g.roundRect(90,420,900,1000,56); g.fill();
  g.strokeStyle='#34342f'; g.lineWidth=3; g.stroke();
  const F='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
  g.fillStyle='#a3a19a'; g.font=`500 30px ${F}`; g.fillText(`MINDPRINT · No. ${no}`,160,530);
  g.fillStyle='#f1efe8'; g.font=`600 110px ${F}`; g.fillText(stt.main,160,670);
  g.fillStyle='#a3a19a'; g.font=`400 40px ${F}`; g.fillText(`${st.name} · ${stt.tags.join(' · ')}`,160,745);
  SK.forEach((s,i)=>{ const y=860+i*120;
    g.fillStyle='#d3d1c7'; g.font=`400 36px ${F}`; g.fillText(s.name,160,y+14);
    g.fillStyle='#34342f'; g.beginPath(); g.roundRect(400,y-12,440,26,13); g.fill();
    g.fillStyle=s.hex; g.beginPath(); g.roundRect(400,y-12,Math.max(26,440*sc[s.k]/100),26,13); g.fill();
    g.fillStyle='#f1efe8'; g.font=`600 36px ${F}`; g.textAlign='right'; g.fillText(sc[s.k],920,y+14); g.textAlign='left'; });
  g.fillStyle='#a3a19a'; g.font=`400 34px ${F}`; g.textAlign='center'; g.fillText('Who are you? Find out on Mindprint',W/2,1560); g.textAlign='left';
  c.toBlob(async b => {
    const f = new File([b],'mindprint.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f]}); return; }catch(e){ if(e.name==='AbortError') return; } }
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='mindprint.png'; a.click();
  });
}
